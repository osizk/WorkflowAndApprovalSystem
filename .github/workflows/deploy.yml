# Based on the Student Cloud Portal workflow for team scd928edd.
# Keep deploy.yml on main, the demo environment, and id-token: write for WIF.
# The app-specific release script manages port 3000, migration and Cloud Run.
name: Deploy to Google Cloud

on:
  pull_request:
    branches: [lab5-staging, main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback to the full commit SHA of an existing image. Empty deploys current main.'
        type: string
        required: false
        default: ''
      seed_demo_data:
        description: 'Initial demo accounts only. Requires all four team secret slots to be populated.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-demo-pr-{0}', github.event.pull_request.number) || 'deploy-demo' }}
  cancel-in-progress: false

jobs:
  deployment-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
      - name: Check Bash syntax and offline release/smoke behavior
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/release.sh
          python3 -B -m unittest discover -s deploy/tests -p 'test_*.py' -v

  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: [test, deployment-checks]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.deployment-checks.result == 'success' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # Names of your team's resources (assigned by the portal)
      SERVICE_NAME: scd928edd
      MIGRATE_JOB_NAME: scd928edd-migrate
      AR_REPOSITORY: scd928edd
      IMAGE_NAME: scd928edd
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
      SEED_DEMO_DATA: ${{ inputs.seed_demo_data && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check settings and Dockerfile
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          for name in PROJECT_ID REGION WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            [ -n "${!name}" ] || { echo "Missing GitHub variable for $name (see the portal, Team resources tab)"; exit 1; }
          done
          [[ "$PROJECT_ID" == cpe-se-course-2026 && "$REGION" == asia-southeast1 ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK" != true || "$SEED_DEMO_DATA" != true ]]
          [ -f Dockerfile ] || { echo 'No Dockerfile at the root of the repository'; exit 1; }

      - name: Sign in to Google Cloud (no key file)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@26f734c2779b00b7dda794207734c511110a4368 # v3

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'

      - name: Build and push the image
        if: env.ROLLBACK != 'true'
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" >/dev/null
          gcloud run jobs describe "$MIGRATE_JOB_NAME" --project "$PROJECT_ID" --region "$REGION" >/dev/null
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          docker build --platform linux/amd64 --build-arg "APP_COMMIT=$GITHUB_SHA" --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Migrate and deploy reviewed main image
        if: env.ROLLBACK != 'true'
        shell: bash
        run: |
          args=()
          if [[ "$SEED_DEMO_DATA" == true ]]; then args+=(--demo); fi
          DRY_RUN=0 bash deploy/release.sh --existing-image "${args[@]}"

      - name: Roll back to an existing image
        if: env.ROLLBACK == 'true'
        run: DRY_RUN=0 bash deploy/release.sh

      - name: Smoke test public URL
        env:
          SMOKE_LOGIN: ${{ vars.SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 -B deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment
        shell: bash
        run: |
          {
            echo '### Workflow and Approval System deployment'
            printf -- '- Commit image tag: `%s`\n' "$IMAGE_TAG"
            printf -- '- Digest: `%s`\n' "$DEPLOYED_IMAGE"
            printf -- '- Serving revision: `%s`\n' "$DEPLOYED_REVISION"
            printf -- '- Rollback: %s\n' "$ROLLBACK"
            printf -- '- URL: %s\n' "$SERVICE_URL"
            echo '- Required smoke checks passed: health, database readiness, HTML and anonymous access restriction.'
            echo '- See the smoke step for the optional signed-in check result.'
          } >> "$GITHUB_STEP_SUMMARY"
